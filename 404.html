<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · FeedTrainMe</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="The page you were looking for could not be found." />
    <style>
      :root {
        --cream: #fefaf3;
        --blush: #f6e2e9;
        --sage: #b8cfb3;
        --moss: #84a282;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        color: var(--moss);
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 540px;
        text-align: center;
        background: var(--cream);
        border: 2px solid var(--moss);
        border-radius: 32px;
        padding: 52px 32px 44px;
        box-shadow: 0 30px 90px -40px rgba(132, 162, 130, 0.6);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 800;
        background: var(--blush);
        border: 1px solid var(--moss);
        border-radius: 999px;
        padding: 6px 14px;
        margin-bottom: 22px;
      }
      .code {
        font-size: 92px;
        font-weight: 900;
        line-height: 1;
        margin: 6px 0 0;
        letter-spacing: -0.02em;
      }
      .code span {
        color: var(--sage);
      }
      h1 {
        font-size: 22px;
        font-weight: 900;
        margin: 18px 0 10px;
      }
      p {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.65;
        color: rgba(132, 162, 130, 0.85);
        margin: 0 0 30px;
      }
      a.btn {
        display: inline-block;
        background: var(--moss);
        color: var(--cream);
        text-decoration: none;
        font-weight: 800;
        font-size: 14px;
        padding: 15px 28px;
        border-radius: 18px;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a.btn:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }
      .links {
        margin-top: 26px;
        padding-top: 22px;
        border-top: 2px solid rgba(132, 162, 130, 0.15);
        font-size: 12px;
        font-weight: 800;
      }
      .links a {
        color: var(--moss);
        text-decoration: none;
        margin: 0 8px;
      }
      .links a:hover {
        text-decoration: underline;
      }
      .foot {
        margin-top: 22px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(132, 162, 130, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Error 404</span>
      <div class="code">4<span>0</span>4</div>
      <h1>This page isn’t in your feed.</h1>
      <p>
        We couldn’t find the page you were looking for. It may have been moved, renamed, or the link
        might be broken.
      </p>
      <a class="btn" href="/">Back to FeedTrainMe</a>
      <div class="links">
        <a href="/#pricing">Pricing</a>·<a href="/#features">Features</a>·<a href="/#contact">Contact</a>
      </div>
      <p class="foot">feedtrain.me · Page not found</p>
    </main>
  </body>
</html>
